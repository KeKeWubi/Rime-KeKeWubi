patch:
  # 输入法切换列表
  schema_list:
    - schema: keke_wubi_86
    - schema: keke_wubi_98
    - schema: keke_wubi_nc

  # 菜单与界面
  menu:
    page_size: 5
  switcher:
    hotkeys:
      - "Control+0"
      - "Shift+Control+0"
    abbreviate_options: true
    caption: "【 输入法设置 】"
    option_list_separator: "｜"

  ascii_composer:
    good_old_caps_lock: true
    switch_key:
      Caps_Lock: commit_code
      Shift_L: commit_code
      Shift_R: commit_code
      Control_L: noop
      Control_R: noop
    inline_ascii: true


  key_binder:
    bindings:
      - when:   has_menu
        accept: semicolon
        send:    2 
      - when:   has_menu
        accept: apostrophe
        send:    3 
      - when:   paging
        accept: comma
        send:   Page_Up
      - when:   has_menu
        accept: period
        send:   Page_Down
        
      # 当处于编码输入状态（composing）时，将小键盘数字追加到输入框，不参与选词也不直接上屏
      - when: composing
        accept: KP_0
        send: 0
      - when: composing
        accept: KP_1
        send: 1
      - when: composing
        accept: KP_2
        send: 2
      - when: composing
        accept: KP_3
        send: 3
      - when: composing
        accept: KP_4
        send: 4
      - when: composing
        accept: KP_5
        send: 5
      - when: composing
        accept: KP_6
        send: 6
      - when: composing
        accept: KP_7
        send: 7
      - when: composing
        accept: KP_8
        send: 8
      - when: composing
        accept: KP_9
        send: 9
      - when: composing
        accept: KP_Decimal
        send: period
      - when: composing
        accept: KP_DECIMAL
        send: period
      - when: has_menu
        accept: KP_Enter
        send: space
        
  recognizer:
    patterns:
      email: "^[-_.0-9A-Za-z]+@.*$"
      uppercase: "[A-Z][-_+.'0-9A-Za-z]*$"
      url: "^(?:www\\.|mailto:|file:|ftp[:./]|localhost)[a-zA-Z0-9_\\-./%&=?#~+@]*$"
      phrase: "^'" 
      cmd: "^(help|conf|conv|date|time|week|rmb[0-9%.]+)$"
